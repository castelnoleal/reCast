<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>reCast Studio Mobile</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#080b12}body{overflow:hidden}</style>
</head>
<body>
<iframe id="studio" src="./mobile.html" title="reCast Studio Mobile"></iframe>
<script>
const frame=document.getElementById('studio');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow, doc=frame.contentDocument;
  const original=win.render;
  win.render=async function(){
    const API='https://api.recast.castelmei.com';
    const token=localStorage.getItem('recast.renderToken')||prompt('Enter your reCast render token. It is stored only in this browser.');
    if(!token)return;
    localStorage.setItem('recast.renderToken',token);
    const set=(x)=>{try{win.setStatus(x)}catch{}};
    const html=win.html||win.frame?.srcdoc;
    if(!html){set('No composition loaded');return;}
    const duration=Math.max(.1,Number(win.duration)||5);
    const inputs=['mw','mh','mf'].map(id=>Number(doc.getElementById(id)?.value));
    const width=Number.isFinite(inputs[0])&&inputs[0]>0?inputs[0]:1920;
    const height=Number.isFinite(inputs[1])&&inputs[1]>0?inputs[1]:1080;
    const fps=Number.isFinite(inputs[2])&&inputs[2]>0?inputs[2]:30;
    if(width*height>8294400||duration>300){set('Render exceeds limits');return}
    try{
      set('Submitting cloud render…');
      const response=await fetch(API+'/v1/render',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({html,config:{id:'mobile-studio',width,height,fps,duration,render:{format:'mp4'}}})});
      const data=await response.json();
      if(!response.ok)throw new Error(data.error||('HTTP '+response.status));
      const id=data.jobId;
      for(;;){
        await new Promise(r=>setTimeout(r,1500));
        const s=await fetch(API+'/v1/render/'+encodeURIComponent(id),{headers:{authorization:'Bearer '+token}});
        const job=await s.json();
        set(job.status==='running'?'Rendering… '+Math.round(Number(job.progress)||0)+'%':job.status);
        if(job.status==='failed')throw new Error(job.error||'Render failed');
        if(job.status==='complete'){
          set('Preparing MP4…');
          const out=await fetch(API+'/v1/render/'+encodeURIComponent(id)+'/output',{headers:{authorization:'Bearer '+token}});
          if(!out.ok)throw new Error('Output download failed: HTTP '+out.status);
          const blob=await out.blob(), url=URL.createObjectURL(blob), a=doc.createElement('a');
          a.href=url;a.download='reCast-'+id+'.mp4';doc.body.appendChild(a);a.click();a.remove();
          set('Render complete');setTimeout(()=>URL.revokeObjectURL(url),60000);return;
        }
      }
    }catch(e){set('Cloud render failed');alert('Cloud render failed:\n'+(e.message||e));}
  };
});
</script>
</body>
</html>
