<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>reCast Studio</title>
<style>
:root{--bg:#080b12;--panel:#101621;--panel2:#151d2b;--line:#263246;--text:#eef3fb;--muted:#8c9ab0;--accent:#7c9cff;--good:#4ade80;--warn:#fbbf24}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}body{overflow:hidden}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px;min-height:40px;cursor:pointer}button:hover{background:#1b2638;border-color:#526585}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--accent);color:#07101f;border-color:var(--accent);font-weight:700}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr 42px}.top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:#0b1019;z-index:5}.brand{font-size:19px;font-weight:800}.brand span{color:var(--accent)}.file{color:var(--muted);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{margin-left:auto;display:flex;gap:7px}.main{min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr) 270px}.side,.inspector{background:var(--panel);overflow:auto}.side{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.section{padding:13px;border-bottom:1px solid var(--line)}.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}.field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;color:var(--muted)}input,select{width:125px;max-width:55%;padding:8px;border:1px solid var(--line);border-radius:7px;background:#0a0f17;color:var(--text);min-height:38px}.scenes{display:grid;gap:6px}.scene{display:flex;justify-content:space-between;padding:10px;border-radius:8px;background:#172033;cursor:pointer}.scene.active{outline:1px solid var(--accent);background:#1b2945}.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 155px}.canvas{min-height:0;display:grid;place-items:center;padding:20px}.stage{width:min(90%,960px);aspect-ratio:16/9;background:#111827;border:1px solid #334155;box-shadow:0 20px 70px #0008;position:relative;overflow:hidden}.stage iframe{width:100%;height:100%;border:0}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}.timeline{border-top:1px solid var(--line);padding:10px 14px;background:#0d131d;overflow:auto}.timeline-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:70px}.track{height:54px;min-width:520px;border:1px solid var(--line);border-radius:7px;position:relative;background:repeating-linear-gradient(90deg,#121a26 0,#121a26 99px,#1e293b 100px);touch-action:none}.clip{position:absolute;left:1%;right:1%;top:8px;height:36px;border-radius:6px;background:linear-gradient(90deg,#536fca,#7656c8);display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0%;pointer-events:none}.log{font:11px/1.5 ui-monospace,monospace;color:#aebbd0;background:#090d14;border-radius:7px;padding:9px;max-height:170px;overflow:auto}.status{display:flex;align-items:center;gap:9px;padding:0 14px;border-top:1px solid var(--line);color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.mobilebar{display:none}
@media(max-width:900px){.app{grid-template-rows:auto 1fr 40px}.top{flex-wrap:wrap;padding:8px 10px}.file{order:3;width:100%;padding:5px 0 0;border:0;border-top:1px solid var(--line)}.actions button:not(.primary){display:none}.actions{margin-left:auto}.main{display:block;position:relative;overflow:hidden}.side,.inspector{display:none}.workspace{height:100%;grid-template-rows:minmax(0,1fr) 130px}.canvas{padding:8px}.stage{width:100%;max-height:calc(100dvh - 235px)}.mobilebar{display:flex;position:absolute;left:8px;right:8px;bottom:8px;z-index:4;justify-content:center;gap:6px}.mobilebar button{background:#101621ee;backdrop-filter:blur(12px);box-shadow:0 8px 25px #0008}.status span:last-child{display:none}}
@media(max-width:600px){.workspace{grid-template-rows:minmax(0,1fr) 115px}.track{min-width:430px}.canvas{padding:6px}.stage{max-height:calc(100dvh - 215px)}button{min-height:42px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">re<span>Cast</span></div><div class="file" id="projectName">Untitled composition</div><div class="actions"><button onclick="newProject()">New</button><button onclick="openProject()">Open HTML</button><button onclick="saveProject()">Save HTML</button><button onclick="checkProject()">Check</button><button class="primary" id="renderBtn" onclick="renderProject()">Render MP4</button></div></header>
<main class="main"><aside class="side"><div class="section"><div class="label">Scenes</div><div class="scenes" id="sceneList"></div><button style="width:100%;margin-top:8px" onclick="addScene()">＋ Add scene</button></div><div class="section"><div class="label">Composition</div><div class="field"><span>Width</span><input id="w" value="1920" inputmode="numeric"></div><div class="field"><span>Height</span><input id="h" value="1080" inputmode="numeric"></div><div class="field"><span>FPS</span><input id="fps" value="30" inputmode="decimal"></div><div class="field"><span>Duration</span><input id="dur" value="5" inputmode="decimal"></div><div class="field"><span>Playback</span><input id="rate" value="1" inputmode="decimal"></div></div></aside>
<section class="workspace"><div class="canvas"><div class="stage"><iframe id="preview" title="Composition preview"></iframe><div class="empty" id="empty">Create or open a composition.</div></div></div><div class="timeline"><div class="timeline-head"><button id="playBtn" onclick="togglePlayback()">▶ Play</button><button onclick="rewind()">↶</button><span class="time" id="time">0.00s</span><span style="color:var(--muted)">Deterministic preview</span></div><div class="track" id="track"><div class="clip" id="clip">Intro · HTML composition</div><div class="playhead" id="playhead"></div></div></div></section>
<aside class="inspector"><div class="section"><div class="label">Output</div><div class="field"><span>Format</span><select id="format"><option>MP4 / H.264</option><option>WebM</option><option>GIF</option></select></div><div class="field"><span>Quality</span><select id="quality"><option>Standard</option><option>High</option><option>Preview</option></select></div><div class="field"><span>Background</span><input id="bg" value="#111827"></div></div><div class="section"><div class="label">Activity</div><div class="log" id="log">reCast Studio ready.</div></div></aside><div class="mobilebar"><button onclick="openScenes()">☰ Scenes</button><button onclick="openSettings()">⚙ Settings</button><button onclick="togglePlayback()" id="mobilePlay">▶ Play</button><button onclick="openProject()">Open</button></div></main>
<footer class="status"><span class="dot"></span><span id="status">Ready</span><span style="margin-left:auto">reCast Studio</span></footer></div>
<script>
const SAMPLE='<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:white;font-family:system-ui}main{height:100%;display:grid;place-items:center}.card{padding:50px 65px;border-radius:26px;background:linear-gradient(135deg,#263c73,#523d83);box-shadow:0 30px 80px #0007;text-align:center;animation:rise 1s both}h1{font-size:clamp(38px,6vw,64px);margin:0 0 8px}p{opacity:.75;font-size:20px}@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}</style></head><body><main><div class="card"><h1>reCast</h1><p>HTML → deterministic video</p></div></main></body></html>';
let html=SAMPLE,playing=false,currentTime=0,raf=0,scenes=[{name:'Intro',duration:5}],selected=0;
const $=id=>document.getElementById(id);function log(x){const l=$('log');l.innerHTML+='<br>'+new Date().toLocaleTimeString()+' · '+x;l.scrollTop=l.scrollHeight}function setStatus(x,warn=false){$('status').textContent=x;const d=document.querySelector('.dot');if(d)d.style.background=warn?'var(--warn)':'var(--good)'}
function cfg(){return{width:Number($('w').value),height:Number($('h').value),fps:Number($('fps').value),duration:Number($('dur').value),playbackRate:Number($('rate').value)||1}}
function checkProject(){const c=cfg();const ok=[c.width,c.height,c.fps,c.duration,c.playbackRate].every(Number.isFinite)&&c.width>0&&c.height>0&&c.fps>0&&c.duration>0&&c.playbackRate>0&&c.duration*c.fps<=90000;if(!ok){setStatus('Invalid composition settings',true);log('Check failed');return false}setStatus('Composition valid');log('Check passed');return true}
function loadPreview(source){html=source||SAMPLE;$('preview').srcdoc=html;$('empty').style.display='none';log('Preview loaded');setStatus('Preview ready');seek(currentTime)}
function newProject(){html=SAMPLE;currentTime=0;selected=0;scenes=[{name:'Intro',duration:cfg().duration||5}];$('projectName').textContent='new-composition.html';renderScenes();loadPreview();setStatus('New composition created')}
function openProject(){const i=document.createElement('input');i.type='file';i.accept='.html,.htm';i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('projectName').textContent=f.name;currentTime=0;loadPreview(String(r.result||''))};r.readAsText(f)};i.click()}
function saveProject(){const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=($('projectName').textContent||'reCast-composition').replace(/\.[^.]+$/,'')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);log('HTML saved');setStatus('Saved')}
function addScene(){const n=scenes.length+1;scenes.push({name:'Scene '+n,duration:cfg().duration||5});renderScenes();log('Added Scene '+n);setStatus('Scene added')}
function selectScene(i){selected=i;currentTime=0;renderScenes();seek(0);log('Selected '+scenes[i].name);setStatus('Selected '+scenes[i].name)}
function renderScenes(){ $('sceneList').innerHTML=scenes.map((s,i)=>'<div class="scene '+(i===selected?'active':'')+'" onclick="selectScene('+i+')"><span>'+s.name+'</span><span>'+Number(s.duration).toFixed(1)+'s</span></div>').join('');$('clip').textContent=scenes[selected]?.name+' · HTML composition'}
function postTime(t){try{const win=$('preview').contentWindow;win.postMessage({type:'recast:seek',time:t},'*');win.document?.getAnimations?.().forEach(a=>{try{a.currentTime=t*1000}catch{}})}catch{} }
function seek(t){const c=cfg(),max=Math.max(.001,c.duration);currentTime=Math.max(0,Math.min(max,t));const pct=currentTime/max*100;$('playhead').style.left=pct+'%';$('time').textContent=currentTime.toFixed(2)+'s';postTime(currentTime*c.playbackRate);}
function timelineSeek(e){const r=$('track').getBoundingClientRect();const x=Math.max(0,Math.min(r.width,e.clientX-r.left));seek(x/r.width*cfg().duration)}
$('track').addEventListener('pointerdown',e=>{timelineSeek(e);const move=ev=>timelineSeek(ev),up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up)};addEventListener('pointermove',move);addEventListener('pointerup',up)})
function rewind(){playing=false;updatePlay();seek(0);setStatus('Rewound')}
function updatePlay(){const text=playing?'❚❚ Pause':'▶ Play';$('playBtn').textContent=text;$('mobilePlay').textContent=text}
function togglePlayback(){if(playing){playing=false;updatePlay();setStatus('Paused');return}if(!checkProject())return;playing=true;updatePlay();setStatus('Playing');let last=performance.now();cancelAnimationFrame(raf);const tick=now=>{if(!playing)return;const delta=(now-last)/1000;last=now;seek(currentTime+delta);if(currentTime>=cfg().duration){playing=false;updatePlay();setStatus('Preview complete');return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function openScenes(){alert('Scenes: '+scenes.map((s,i)=>(i===selected?'• ':'')+s.name).join(' | '))}
function openSettings(){const c=cfg();const value=prompt('Width, height, FPS, duration, playback rate',`${c.width}, ${c.height}, ${c.fps}, ${c.duration}, ${c.playbackRate}`);if(!value)return;const p=value.split(',').map(Number);if(p.length>=4){[$('w').value,$('h').value,$('fps').value,$('dur').value]=p.slice(0,4);if(p[4]>0)$('rate').value=p[4];checkProject()}}
window.addEventListener('message',e=>{if(e.data?.type==='recast:request-html')e.source?.postMessage({type:'recast:html',html},'*')});$('preview').addEventListener('load',()=>{try{$('preview').contentWindow.postMessage({type:'recast:init',time:currentTime},'*')}catch{}});renderScenes();loadPreview(html);
</script><script src="./studio-runtime.js"></script><script src="./studio-compat.js"></script></body></html>
