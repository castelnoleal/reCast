<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>reCast Studio Mobile</title><style>:root{--bg:#080b12;--p:#111827;--p2:#172033;--line:#29364d;--text:#eef3fb;--muted:#94a3b8;--a:#7c9cff;--good:#4ade80}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:max(9px,env(safe-area-inset-top)) 12px 9px;border-bottom:1px solid var(--line);background:#0b1019ee;backdrop-filter:blur(16px)}.row{display:flex;align-items:center;gap:8px}.brand{font-size:20px;font-weight:850}.brand b{color:var(--a)}.name{min-width:0;flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{min-height:42px;border:1px solid var(--line);background:var(--p2);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:650}.primary{background:var(--a);color:#07101f;border-color:var(--a)}main{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}.preview{min-height:0;display:grid;place-items:center;padding:9px}.stage{width:100%;max-height:100%;aspect-ratio:16/9;background:#111827;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px #0008}.stage iframe{width:100%;height:100%;border:0}.timeline{padding:8px;background:#0d131d;border-top:1px solid var(--line);overflow-x:auto}.ruler,.track{min-width:500px}.ruler{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding-bottom:5px}.track{height:48px;position:relative;border:1px solid var(--line);border-radius:8px;background:repeating-linear-gradient(90deg,#121a26 0,#121a26 99px,#263246 100px)}.clip{position:absolute;left:2%;right:20%;top:7px;height:32px;border-radius:7px;background:linear-gradient(90deg,#536fca,#7656c8);display:flex;align-items:center;padding:0 9px;font-size:11px}.head{position:absolute;top:0;bottom:0;width:2px;background:white;left:0%}.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px 9px max(8px,env(safe-area-inset-bottom));background:#0b1018;border-top:1px solid var(--line)}.drawer{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.drawer.open{display:flex}.sheet{width:100%;max-height:80dvh;overflow:auto;background:var(--p);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px;padding-bottom:max(18px,env(safe-area-inset-bottom))}.headrow{display:flex;justify-content:space-between;align-items:center}.scene{display:flex;justify-content:space-between;padding:13px;margin:7px 0;background:var(--p2);border:1px solid transparent;border-radius:10px}.scene.active{border-color:var(--a)}.field{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--muted)}input,select{width:150px;max-width:55%;min-height:42px;border:1px solid var(--line);border-radius:9px;background:#090e16;color:var(--text);padding:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.status{padding:7px 11px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}@media(orientation:landscape) and (max-height:600px){.top{padding:5px 10px}.preview{padding:4px}.timeline{padding:4px}.bar{padding:4px 7px}.status{display:none}}</style></head><body><div class="app"><header class="top"><div class="row"><div class="brand">re<b>Cast</b></div><div class="name" id="name">Untitled composition</div><button class="btn" onclick="openFile()">Open</button><button class="btn primary" onclick="render()">Render</button></div></header><main><section class="preview"><div class="stage"><iframe id="frame" title="reCast preview"></iframe></div></section><section class="timeline"><div class="ruler"><span>0s</span><span>1s</span><span>2s</span><span>3s</span><span>4s</span><span id="end">5s</span></div><div class="track" id="track"><div class="clip">HTML composition</div><div class="head" id="head"></div></div></section></main><nav class="bar"><button class="btn" onclick="drawer('scenes')">☰ Scenes</button><button class="btn" onclick="drawer('settings')">⚙ Settings</button><button class="btn" id="play" onclick="play()">▶ Play</button><button class="btn" onclick="newProject()">＋ New</button></nav><footer class="status"><span class="dot"></span><span id="status">Ready</span></footer></div><div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><section class="sheet"><div class="headrow"><strong id="title">Scenes</strong><button class="btn" onclick="closeDrawer()">Close</button></div><div id="content"></div></section></div><input id="file" type="file" accept=".html,.htm" hidden><script>const sample='<!doctype html><html><head><style>html,body{margin:0;height:100%;overflow:hidden;background:#101827;color:white;font-family:system-ui}main{height:100%;display:grid;place-items:center}.card{padding:10vw 12vw;border-radius:24px;background:linear-gradient(135deg,#263c73,#523d83);text-align:center;box-shadow:0 30px 80px #0008;animation:up 1s both}h1{font-size:clamp(38px,8vw,70px);margin:0 0 8px}p{opacity:.75;font-size:clamp(14px,3vw,22px)}@keyframes up{from{opacity:0;transform:translateY(35px) scale(.97)}to{opacity:1;transform:none}}</style></head><body><main><div class="card"><h1>reCast</h1><p>HTML → deterministic video</p></div></main></body></html>';let html=sample,playing=false,duration=5,raf=0,start=0,offset=0;frame.srcdoc=html;function setStatus(x){status.textContent=x}function openFile(){file.click()}file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{html=r.result;frame.srcdoc=html;name.textContent=f.name;setStatus('Opened '+f.name)};r.readAsText(f)};function newProject(){html=sample;frame.srcdoc=html;name.textContent='new-composition';setStatus('New composition created')}function play(){playing=!playing;play.textContent=playing?'❚❚ Pause':'▶ Play';if(playing){start=performance.now()-offset*1000;tick()}else cancelAnimationFrame(raf);setStatus(playing?'Playing':'Paused')}function tick(){if(!playing)return;offset=((performance.now()-start)/1000)%duration;head.style.left=(offset/duration*100)+'%';frame.contentWindow.postMessage({type:'recast:time',time:offset},'*');raf=requestAnimationFrame(tick)}track.onpointerdown=e=>{const r=track.getBoundingClientRect();offset=Math.max(0,Math.min(duration,(e.clientX-r.left)/r.width*duration));head.style.left=(offset/duration*100)+'%';start=performance.now()-offset*1000;setStatus('Timeline '+offset.toFixed(2)+'s')};function drawer(type){drawerEl.classList.add('open');title.textContent=type==='scenes'?'Scenes':'Settings';content.innerHTML=type==='scenes'?`<div class="scene active"><span>Intro</span><span>${duration.toFixed(1)}s</span></div><button class="btn" style="width:100%" onclick="addScene()">＋ Add scene</button>`:`<div class="field"><span>Width</span><input id="mw" value="1920" inputmode="numeric"></div><div class="field"><span>Height</span><input id="mh" value="1080" inputmode="numeric"></div><div class="field"><span>FPS</span><input id="mf" value="30" inputmode="numeric"></div><div class="field"><span>Duration</span><input id="md" value="${duration}" inputmode="decimal"></div><div class="actions"><button class="btn" onclick="apply()">Apply</button><button class="btn" onclick="check()">Check</button></div>`}const drawerEl=document.getElementById('drawer');function closeDrawer(){drawerEl.classList.remove('open')}function addScene(){setStatus('Scene added');closeDrawer()}function apply(){duration=Math.max(.1,Number(md.value)||5);end.textContent=duration+'s';closeDrawer();setStatus('Settings applied')}function check(){const v=[mw.value,mh.value,mf.value,md.value].map(Number);setStatus(v.every(x=>Number.isFinite(x)&&x>0)?'Settings valid':'Invalid settings')}function render(){setStatus('Render requested');alert('Hosted rendering will become available when the reCast Cloud render API is configured. Local rendering: run `recast render`.')} </script></body></html>
